<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prioritize Power-Up</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <script>
      (function () {
        window.addEventListener('unhandledrejection', function (e) {
          if (
            e &&
            e.reason &&
            (e.reason.name === 'PostMessageValidationCard' ||
              (e.reason.message && e.reason.message.indexOf('Card Scope not available') !== -1) ||
              String(e.reason).indexOf('Card Scope not available') !== -1)
          ) {
            e.preventDefault();
          }
        });

        var origWarn = console.warn;
        console.warn = function () {
          var first = arguments[0];
          if (
            first &&
            (first.gateName === 'platform-dst-motion-theme-default' ||
              (first.msg && String(first.msg).indexOf('feature gate') !== -1) ||
              (typeof first === 'string' && first.indexOf('feature gate') !== -1))
          ) {
            return;
          }
          return origWarn.apply(console, arguments);
        };

        var origError = console.error;
        console.error = function () {
          var first = arguments[0];
          if (
            first &&
            (first.gateName === 'platform-dst-motion-theme-default' ||
              (first.msg && String(first.msg).indexOf('feature gate') !== -1) ||
              (typeof first === 'string' && first.indexOf('feature gate') !== -1))
          ) {
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
        background-color: #1D2125 !important;
        color: #F7F8F9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        background-color: #1D2125;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/prioritize/main.jsx"></script>
  </body>
</html>
